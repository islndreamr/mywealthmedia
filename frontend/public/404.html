<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#141110" />
  <meta name="robots" content="noindex" />

  <title>Page not found — My Wealth Media</title>

  <link rel="icon" href="/assets/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@300;400&family=Inter:wght@300;400&family=Jost:wght@400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/style.css" />
  <style>
    .nf {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .nf-mark {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      overflow: hidden;
      margin-bottom: 40px;
    }
    .nf-mark img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .nf-code {
      font-family: 'Cormorant', Georgia, serif;
      font-weight: 300;
      color: var(--cream);
      font-size: clamp(6rem, 20vw, 13rem);
      line-height: 1;
      letter-spacing: 0.04em;
      margin: 0 0 28px;
    }
    .nf-line {
      color: var(--muted);
      font-size: 17px;
      max-width: 34em;
      margin: 0 0 44px;
    }
    .nf-line em { color: var(--cream); font-style: normal; }
  </style>
</head>
<body>
  <main class="nf" data-testid="not-found-page">
    <div class="nf-mark">
      <img src="/assets/mwm-mark.png" alt="My Wealth Media" width="72" height="72" />
    </div>
    <h1 class="nf-code">404</h1>
    <p class="nf-line">This page doesn&rsquo;t exist. <em>The rest of the operation runs just fine.</em></p>
    <a class="btn-ghost" href="/" data-testid="back-home-link">Back to the site</a>
  </main>
</body>
</html>
